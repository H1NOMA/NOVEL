name: Desktop builds

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Publish a GitHub Release with this tag (e.g. v0.1.0); leave empty to only build artifacts'
        required: false
        default: ''
  push:
    branches:
      - main
      - master
      - claude/helldivers-galactic-strategy-my9j9a
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Package Windows x64
        run: npm run app:win
        env:
          RELEASE_TAG: ${{ github.event.inputs.release_tag || github.ref_name }}

      - name: Package Linux x64
        run: npm run app:linux
        env:
          RELEASE_TAG: ${{ github.event.inputs.release_tag || github.ref_name }}

      - name: Zip builds
        run: |
          cd release
          zip -qr9 SecondGalacticWar-win32-x64.zip SecondGalacticWar-win32-x64
          zip -qr9 SecondGalacticWar-linux-x64.zip SecondGalacticWar-linux-x64

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: SecondGalacticWar-win32-x64
          path: release/SecondGalacticWar-win32-x64.zip
          compression-level: 0

      - name: Upload Linux build
        uses: actions/upload-artifact@v4
        with:
          name: SecondGalacticWar-linux-x64
          path: release/SecondGalacticWar-linux-x64.zip
          compression-level: 0

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          gh release create "${RELEASE_TAG}" \
            release/SecondGalacticWar-win32-x64.zip \
            release/SecondGalacticWar-linux-x64.zip \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "The Second Galactic War ${RELEASE_TAG}" \
            --notes "Portable desktop builds of The Second Galactic War — a real-time galactic strategy game in the Helldivers 2 setting.

          **Windows**: download \`SecondGalacticWar-win32-x64.zip\`, unzip anywhere, run \`SecondGalacticWar.exe\`. No installation required. F11 toggles fullscreen.

          **Linux**: download \`SecondGalacticWar-linux-x64.zip\`, unzip, run \`SecondGalacticWar\`."
