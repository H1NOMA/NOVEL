name: Desktop builds

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
      - claude/helldivers-galactic-strategy-my9j9a

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Package Windows x64
        run: npm run app:win

      - name: Package Linux x64
        run: npm run app:linux

      - name: Zip builds
        run: |
          cd release
          zip -qr9 SecondGalacticWar-win32-x64.zip SecondGalacticWar-win32-x64
          zip -qr9 SecondGalacticWar-linux-x64.zip SecondGalacticWar-linux-x64

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: SecondGalacticWar-win32-x64
          path: release/SecondGalacticWar-win32-x64.zip
          compression-level: 0

      - name: Upload Linux build
        uses: actions/upload-artifact@v4
        with:
          name: SecondGalacticWar-linux-x64
          path: release/SecondGalacticWar-linux-x64.zip
          compression-level: 0
